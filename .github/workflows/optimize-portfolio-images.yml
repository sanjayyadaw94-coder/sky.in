name: Optimize portfolio images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-portfolio-images.yml'
      - 'tools/optimize_site_images.py'
      - 'docs/assets/portrait.png'
      - 'docs/assets/solution-field-photo.png'
      - 'docs/assets/solution-web-responsive.png'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-image-optimizer
  cancel-in-progress: false

jobs:
  optimize-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Create optimized WebP assets and update image sources
        run: python tools/optimize_site_images.py

      - name: Verify optimized files and local image references
        run: python tools/optimize_site_images.py --check

      - name: Commit safe image optimization results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- docs/assets docs/index.html docs/about.html docs/gallery.html
          if git diff --cached --quiet; then
            echo "Images are already optimized."
          else
            git commit -m "Optimize portfolio PNGs as responsive WebP assets"
            git push origin HEAD:main
          fi
