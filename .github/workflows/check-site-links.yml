name: Check portfolio page links
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tools/check_site_links.py"
      - ".github/workflows/check-site-links.yml"
  pull_request:
    paths:
      - "docs/**"
      - "tools/check_site_links.py"
      - ".github/workflows/check-site-links.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate portfolio navigation and all local assets
        run: python tools/check_site_links.py
